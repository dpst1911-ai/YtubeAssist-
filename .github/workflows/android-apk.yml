name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'source_bundle.tar.xz.base64'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Android source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source_bundle.tar.xz.base64 > source_bundle.tar.xz
          echo '4c080071fabd11a1949786c586c4c07733f96552deb2ecaa3d2a137e6555b03b  source_bundle.tar.xz' | sha256sum -c -
          tar -xJf source_bundle.tar.xz
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test Java logic and source structure
        run: |
          bash scripts/test_core.sh
          python3 scripts/test_structure.py
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YTWatchAssist-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
